<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projets Power BI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171C;
    --panel: #1B1F26;
    --line: #2A2F38;
    --ink: #EDEDE8;
    --ink-dim: #9BA1AC;
    --accent: #D9A441;
    --accent-dim: #8A6A2E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif;
    line-height:1.5;
  }
  .wrap{
    max-width:880px;
    margin:0 auto;
    padding: 64px 24px 96px;
  }
  header{
    margin-bottom:56px;
    border-bottom:1px solid var(--line);
    padding-bottom:32px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    margin:0 0 12px;
    letter-spacing:-0.02em;
    color:var(--ink);
  }
  h1 span{color:var(--accent);}
  header p{
    color:var(--ink-dim);
    font-size:1.05rem;
    max-width:52ch;
    margin:0;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap:16px;
  }
  .card{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:24px;
    padding:24px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    text-decoration:none;
    color:var(--ink);
    transition: border-color .15s ease, transform .15s ease;
    min-height:150px;
  }
  .card:hover, .card:focus-visible{
    border-color:var(--accent-dim);
    transform:translateY(-2px);
  }
  .card:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .meta{
    font-size:.78rem;
    color:var(--ink-dim);
    font-family:'Space Grotesk', sans-serif;
  }
  .card h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:1.15rem;
    font-weight:600;
    margin:0;
    line-height:1.3;
  }
  .card .open{
    font-size:.85rem;
    color:var(--accent);
  }
  section.stage{
    margin-top:56px;
    border-top:1px solid var(--line);
    padding-top:32px;
  }
  section.stage h3{
    font-family:'Space Grotesk', sans-serif;
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0 0 20px;
    color:var(--ink);
  }
  .empty{
    color:var(--ink-dim);
    border:1px dashed var(--line);
    border-radius:4px;
    padding:32px;
    text-align:center;
    font-size:.95rem;
  }
  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Projets <span>Power BI</span></h1>
    <p>Une sélection de mes tableaux de bord et rapports Power BI. Cliquez sur une carte pour ouvrir le rapport.</p>
  </header>

  <div class="grid" id="grid"></div>

  <section class="stage">
    <h3>Rapport de stage</h3>
    <div class="grid">
      <a class="card" href="https://youcefml-byte.github.io/Rapport-de-stage-L3/" target="_blank" rel="noopener noreferrer">
        <div class="meta">RAPPORT DE STAGE</div>
        <h2>Rapport de stage L3</h2>
        <span class="open">Ouvrir le rapport</span>
      </a>
    </div>
  </section>
</div>

<script>
  /* ============================================================
     MES PROJETS — c'est ici que tu mets à jour le site.
     Pour ajouter un projet : copie une ligne { title, url },
     colle-la avant le "]" et change le titre + le lien.
     Pour en retirer un : supprime sa ligne.
     ============================================================ */
  const projects = [
    {
      title: "CA_de_ventes_et_pertes",
      url: "https://app.powerbi.com/groups/me/reports/c00f29f9-2903-44dc-baf1-96ab87d60817/12e019dc82e335045760?experience=power-bi"
    },
    {
      title: "Données démographique et météo du monde",
      url: "https://app.powerbi.com/groups/me/reports/65991729-a60f-4db4-be90-46768c4bfffc/2729e34bc7268dda571a?experience=power-bi"
    },
    {
      title: "Données_Employés",
      url: "https://app.powerbi.com/groups/64c4bafb-3373-4673-866a-2aeb44bf4240/reports/5eb81f1e-83da-4d1a-affb-a5798b92cfd6/18e6edc82172a83a37d4?experience=power-bi"
    }
    // , { title: "Autre projet", url: "https://app.powerbi.com/..." }
  ];

  /* ---- Affichage (pas besoin de modifier ce qui suit) ---- */
  const grid = document.getElementById('grid');

  if (projects.length === 0) {
    const div = document.createElement('div');
    div.className = 'empty';
    div.textContent = 'Aucun projet pour le moment.';
    grid.appendChild(div);
  }

  projects.forEach(p => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = p.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = 'RAPPORT POWER BI';

    const h2 = document.createElement('h2');
    h2.textContent = p.title;

    const open = document.createElement('span');
    open.className = 'open';
    open.textContent = 'Ouvrir le rapport';

    card.append(meta, h2, open);
    grid.appendChild(card);
  });
</script>
</body>
</html>
